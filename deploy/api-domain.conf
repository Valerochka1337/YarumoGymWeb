# Web preview on the existing API domain. Preserve API/admin/health routes.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.valerochkagym.tech;
    ssl_certificate /etc/letsencrypt/live/api.valerochkagym.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.valerochkagym.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /srv/yarumo-web/current;
    index index.html;
    client_max_body_size 10m;
    client_body_timeout 15s;
    access_log /var/log/nginx/api.valerochkagym.tech.access.log;
    error_log /var/log/nginx/api.valerochkagym.tech.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    location = /health {
        proxy_pass http://127.0.0.1:18080/actuator/health/readiness;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location /actuator { return 404; }
    location /v1/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }
    location ~ ^/(admin|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /manifest.webmanifest { expires -1; try_files $uri =404; }
    location = /index.html { expires -1; try_files $uri =404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    listen [::]:80;
    server_name api.valerochkagym.tech;
    return 301 https://$host$request_uri;
}
