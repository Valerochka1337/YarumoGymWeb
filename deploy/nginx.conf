# Include inside the existing HTTPS server block for api.valerochkagym.tech.
# TLS certificates and backend upstream must be configured on the existing host.
root /srv/yarumo-web/current;
index index.html;
client_max_body_size 10m;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
# GIS popup sign-in requires same-origin-allow-popups.
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
location /v1/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    # Do not log query data or request bodies for auth, AI or journal endpoints.
    access_log off;
}
location = /sw.js { expires -1; try_files $uri =404; }
location = /manifest.webmanifest { expires -1; try_files $uri =404; }
location = /index.html { expires -1; try_files $uri =404; }
location /assets/ { expires 1y; try_files $uri =404; }
location / { try_files $uri $uri/ /index.html; }
