# Installed as /etc/nginx/sites-available/app.valerochkagym.tech.
# Static releases are switched atomically through /srv/yarumo-web/current.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app.valerochkagym.tech;
  ssl_certificate /etc/letsencrypt/live/app.valerochkagym.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.valerochkagym.tech/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  root /srv/yarumo-web/current;
  index index.html;
  access_log /var/log/nginx/app.valerochkagym.tech.access.log;
  error_log /var/log/nginx/app.valerochkagym.tech.error.log;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  location ~ "^/r/[A-Za-z0-9_-]{43}$" {
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    try_files /index.html =404;
  }
  location ~ "^/v1/routine-shares/preview/[A-Za-z0-9_-]{43}(/import|/trial-results)?$" {
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host api.valerochkagym.tech;
    proxy_set_header Origin https://app.valerochkagym.tech;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
  }
  location /v1/ {
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host api.valerochkagym.tech;
    proxy_set_header Origin https://app.valerochkagym.tech;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
server {
  listen 80;
  listen [::]:80;
  server_name app.valerochkagym.tech;
  location /.well-known/acme-challenge/ { root /srv/yarumo-web/current; }
  location / { return 301 https://$host$request_uri; }
}
